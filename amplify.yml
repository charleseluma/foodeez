version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: '/' # install and build from the repo root (npm workspaces)
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=apps/web
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*
